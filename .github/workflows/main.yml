on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - beta
    runs-on: ubuntu-latest
    name: Test (${{ matrix.rust }})
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: "Test local rust"
        uses: ./
        with:
          manifest-path: './example-rust/Cargo.toml'

  fmt:
    runs-on: ubuntu-latest
    name: Format check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --manifest-path ./example-rust/Cargo.toml --all -- --check

  clippy:
    runs-on: ubuntu-latest
    name: Clippy check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy -D warnings
        run: cargo clippy --manifest-path ./example-rust/Cargo.toml --all-targets --all-features -- -D warnings